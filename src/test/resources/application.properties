# Test-wide defaults.
#
# The background polling loop is disabled for tests. Several integration tests create PENDING jobs and
# assert on their state; a poller running concurrently would claim those jobs out from under the
# assertions and make the tests flaky. Tests that exercise the scheduler itself re-enable it explicitly.
#
# This file is merged with src/main/resources/application.yml rather than replacing it, because Spring
# Boot loads application.properties and application.yml separately and gives .properties precedence.
scheduler.enabled=false
