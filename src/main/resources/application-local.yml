logging:
  level:
    com.scheduler.job: DEBUG

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/scheduler_db
    username: scheduler_user
    password: scheduler_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

aws:
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}
  sqs:
    endpoint: ${SQS_ENDPOINT:http://localhost:4566}
    # LocalStack starts empty; let the application create the queues it needs for local development.
    auto-create-queues: true
