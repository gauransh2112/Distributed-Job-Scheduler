spring:
  application:
    name: distributed-job-scheduler
  profiles:
    active: local

scheduler:
  defaults:
    max-retries: 5
    max-page-size: 100

aws:
  region: ${AWS_REGION:us-east-1}
  sqs:
    # SQS is the default publisher implementation. Setting this to false activates NoopQueuePublisher,
    # which discards messages and must never be used in a deployed environment.
    enabled: true
    queue-name: ${SQS_QUEUE_NAME:job-scheduler-jobs}
    dlq-name: ${SQS_DLQ_NAME:job-scheduler-jobs-dlq}
    # Window a worker has to reach a durable outcome before the message is redelivered.
    visibility-timeout-seconds: ${SQS_VISIBILITY_TIMEOUT_SECONDS:30}
    # Long polling; SQS maximum is 20.
    wait-time-seconds: ${SQS_WAIT_TIME_SECONDS:10}
    # SQS maximum is 10.
    max-messages-per-poll: ${SQS_MAX_MESSAGES_PER_POLL:10}
    # Queues are owned by infrastructure outside local development.
    auto-create-queues: ${SQS_AUTO_CREATE_QUEUES:false}

logging:
  level:
    root: INFO
    com.scheduler.job: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
